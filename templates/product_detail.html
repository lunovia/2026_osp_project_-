<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail:</title>
        <link rel="stylesheet"
          href="{{ url_for('static', filename='css/product_detail.css') }}">
</head>

<body>
    <main class="product-detail">

        <!--Product Image-->
       <div class="product-image">
    {% if product.img_path is defined and product.img_path %}
    <img
        src="{{ url_for('static', filename='uploads/' ~ product.img_path) }}"
        alt="{{ product.name }}">
    {% endif %}
</div>
        <!--Product Information-->
        <div class ="product-info">
            <h1>{{product.name}}</h1>
            <h2>₩{{ product.price }}</h2>

            <div class="product-description">
            <p>Seller: {{ product.seller_id }}</p>
            <p>Address: {{ product.address }}</p>
            <p>Status: {{ product.status }}</p>
            <p>Email: {{ product.email }}</p> </div>
        </div>

    </main>
</body>
</html>
