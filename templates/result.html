{% extends "base.html" %}
{% block content %}
<h2>상품 등록 결과</h2>

<p>상품명: {{ data['product_name'] }}</p>
<p>판매자 ID: {{ data['seller_id'] }}</p>
<p>가격: {{ data['price'] }}</p>
<p>주소: {{ data['address'] }}</p>
<p>상태: {{ data['status'] }}</p>
<p>이메일: {{ data['email'] }}</p>

<img src="{{ url_for('static', filename='uploads/' ~ picture) }}" width="300">
{% endblock %}
