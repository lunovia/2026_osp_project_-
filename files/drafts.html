<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이음방 · 임시 저장</title>
<link rel="stylesheet" href="../ieumbang/common.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-active="post" data-dw="1280">
<div class="ieum-page">
<div id="ieum-header"></div>
<main class="wrap">
<h1 class="ttl">임시 저장한 방</h1>
<p class="sub">작성 중이던 방 내놓기 글을 이어서 쓰거나 삭제할 수 있어요.</p>
<div id="list"></div>
</main>
</div>
<script src="../ieumbang/auth.js"></script>
<script src="../ieumbang/common.js"></script>
<script>
(function(){
  var K='ieumbang_drafts',box=document.getElementById('list');
  function get(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return []}}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function render(){
    var l=get().reverse();
    if(!l.length){box.innerHTML='<div class="dr-empty">임시 저장된 글이 없어요.<br><br><a class="btn pri" style="display:inline-flex;align-items:center;height:42px;padding:0 22px;text-decoration:none" href="post.html">방 내놓기로 가기</a></div>';return}
    box.innerHTML=l.map(function(d){var t=new Date(d.savedAt);
      return '<div class="dr-item"><div class="inf"><h3>'+esc(d.title)+'</h3><div class="when">'+t.getFullYear()+'.'+(t.getMonth()+1)+'.'+t.getDate()+' '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+' 저장 · '+esc(d.price)+'</div><div class="memo">'+esc(d.memo||'(한마디 없음)')+'</div></div>'
        +'<a class="btn pri" style="display:inline-flex;align-items:center;text-decoration:none" href="post.html?draft='+d.id+'">이어서 작성</a>'
        +'<button class="btn out" data-del="'+d.id+'">삭제</button></div>'}).join('');
    [].forEach.call(box.querySelectorAll('[data-del]'),function(b){b.onclick=function(){
      var id=b.getAttribute('data-del');localStorage.setItem(K,JSON.stringify(get().filter(function(x){return String(x.id)!==id})));render()}});
  }
  render();
})();
</script>
</body>
</html>
