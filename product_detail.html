
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Product Detail - EwhaMarket</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #263445;
            color: white;
            padding: 20px 40px;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
        }

        .product {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .product-image {
            width: 350px;
            max-width: 45%;
            border-radius: 8px;
            object-fit: contain;
        }

        .product-info {
            flex: 1;
        }

        .product-info h1 {
            margin-top: 0;
        }

        .price {
            font-size: 26px;
            font-weight: bold;
            color: #333;
        }

        .info-row {
            margin: 15px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .label {
            font-weight: bold;
            margin-right: 10px;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #263445;
        }

        @media (max-width: 650px) {
            .product {
                flex-direction: column;
            }

            .product-image {
                max-width: 100%;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="/">EwhaMarket</a>
        <a href="/products">Product List</a>
    </header>

    <main class="container">
        <div class="product">

            {% if product.img_path %}
            <img
                class="product-image"
                src="{{ url_for('static',
                     filename='uploads/' ~ product.img_path) }}"
                alt="{{ product.product_name }}">
            {% endif %}

            <div class="product-info">
                <h1>{{ product.product_name }}</h1>

                <p class="price">{{ product.price }} won</p>

                <div class="info-row">
                    <span class="label">Seller ID:</span>
                    {{ product.seller_id }}
                </div>

                <div class="info-row">
                    <span class="label">Address:</span>
                    {{ product.address }}
                </div>

                <div class="info-row">
                    <span class="label">Status:</span>
                    {{ product.status }}
                </div>

                <div class="info-row">
                    <span class="label">Email:</span>
                    {{ product.email }}
                </div>
            </div>
        </div>

        <a class="back-link" href="/products">
            Back to Product List
        </a>
    </main>
</body>
</html>
